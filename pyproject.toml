[project]
name = "pulsar-asyncio-client"
description = "Coroutine message listeners for the Apache Pulsar Python client"
authors = [
    {name = "Mark Parncutt", email = "me@markparncutt.com"},
]
dynamic = ["version"]
dependencies = [
    "pulsar-client>=3.13.0"
]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm.version]
source = "scm"
write_to = "pulsar_asyncio/version.py"
write_template = "# Dynamically generated by build system, do not modify.\n__version__ = version = \"{}\"\n"

[tool.pdm.build]
excludes = ["./**/.git"]
includes = ["pulsar_asyncio/"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
test = ["pytest>=7.4.3"]
lint = ["ruff>=0.14.0,<0.15"]

[tool.pdm.scripts]
lint = { composite = ["ruff check .", "ruff format --check ."] }
lint-fix = { composite = ["ruff check --fix .", "ruff format ."] }
test = "pytest -m 'not integration'"
test-integration = "pytest -m integration"

[tool.pytest.ini_options]
markers = ["integration: requires a Pulsar broker at localhost:6650"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["pulsar_asyncio/version.py"]

[tool.ruff.lint]
# Syntax/style errors, unused names, import sorting, common bugs, and
# modernization compatible with the minimum supported Python version.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
